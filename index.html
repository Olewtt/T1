<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stickman Sprung-Spiel</title>
<style>
  body {
    margin: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    user-select: none;
  }
  h1 { margin-bottom: 8px; font-size: 22px; }
  #info { margin-bottom: 10px; font-size: 16px; }
  canvas {
    background: linear-gradient(to bottom, #c1ffc1 100%, #c1ffc1 100%);
    border: 3px solid #000000;
    border-radius: 8px;
    display: block;
  }
  #hint { margin-top: 10px; font-size: 13px; color: #ccc; }
</style>
</head>
<body>
  <h1>Stickman Sprung-Spiel</h1>
  <div id="info">Punkte: <span id="score">0</span> | Highscore: <span id="highscore">0</span></div>
  <canvas id="game" width="700" height="300"></canvas>
  <div id="hint">Leertaste / Klick / Tippen zum Springen</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const GROUND_Y = 240;
    let highscore = 0;
    let stickman, obstacles, score, gameSpeed, running, spawnTimer, animTime;

    function resetGame() {
      stickman = { x: 80, y: GROUND_Y, width: 20, height: 50, vy: 0, jumping: false, legPhase: 0 };
      obstacles = [];
      score = 0;
      gameSpeed = 2;
      running = true;
      spawnTimer = 0;
      animTime = 0;
      scoreEl.textContent = '0';
    }

    function jump() {
      if (!running) { resetGame(); requestAnimationFrame(loop); return; }
      if (!stickman.jumping) { stickman.vy = -12; stickman.jumping = true; }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); jump(); }
    });
    canvas.addEventListener('mousedown', jump);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

    function spawnObstacle() {
      const height = 30 + Math.random() * 30;
      obstacles.push({ x: canvas.width, y: GROUND_Y + 50 - height, width: 18, height: height });
    }

    function drawStickman(sm) {
      ctx.strokeStyle = '#0000cb;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      const headR = 8;
      const bodyTop = sm.y - sm.height + headR * 2;
      const bodyBottom = sm.y - 12;
      const centerX = sm.x + sm.width / 2;

      ctx.beginPath();
      ctx.arc(centerX, sm.y - sm.height + headR, headR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(centerX, bodyTop);
      ctx.lineTo(centerX, bodyBottom);
      ctx.stroke();

      const armSwing = Math.sin(sm.legPhase) * 10;
      ctx.beginPath();
      ctx.moveTo(centerX, bodyTop + 8);
      ctx.lineTo(centerX - 12, bodyTop + 20 + armSwing);
      ctx.moveTo(centerX, bodyTop + 8);
      ctx.lineTo(centerX + 12, bodyTop + 20 - armSwing);
      ctx.stroke();

      if (sm.jumping) {
        ctx.beginPath();
        ctx.moveTo(centerX, bodyBottom);
        ctx.lineTo(centerX - 10, sm.y);
        ctx.moveTo(centerX, bodyBottom);
        ctx.lineTo(centerX + 10, sm.y);
        ctx.stroke();
      } else {
        const legSwing = Math.sin(sm.legPhase) * 12;
        ctx.beginPath();
        ctx.moveTo(centerX, bodyBottom);
        ctx.lineTo(centerX - legSwing, sm.y);
        ctx.moveTo(centerX, bodyBottom);
        ctx.lineTo(centerX + legSwing, sm.y);
        ctx.stroke();
      }
    }

    function drawGround() {
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y + 50);
      ctx.lineTo(canvas.width, GROUND_Y + 50);
      ctx.stroke();
    }

    function drawObstacle(o) {
      ctx.fillStyle = '#0f3460';
      ctx.strokeStyle = '#e94560';
      ctx.lineWidth = 2;
      ctx.fillRect(o.x, o.y, o.width, o.height);
      ctx.strokeRect(o.x, o.y, o.width, o.height);
    }

    function checkCollision(sm, o) {
      const smBox = { x: sm.x - 2, y: sm.y - sm.height, width: sm.width + 4, height: sm.height };
      return smBox.x < o.x + o.width && smBox.x + smBox.width > o.x &&
             smBox.y < o.y + o.height && smBox.y + smBox.height > o.y;
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = 'white';
      ctx.font = '16px Arial';
      ctx.fillText('Punkte: ' + Math.floor(score), canvas.width / 2, canvas.height / 2 + 20);
      ctx.font = '14px Arial';
      ctx.fillText('Klicken, tippen oder Leertaste zum Neustart', canvas.width / 2, canvas.height / 2 + 45);
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (running) {
        animTime++;
        stickman.legPhase += stickman.jumping ? 0 : 0.35;
        stickman.vy += 0.6;
        stickman.y += stickman.vy;
        if (stickman.y > GROUND_Y) { stickman.y = GROUND_Y; stickman.vy = 0; stickman.jumping = false; }

        spawnTimer++;
        const spawnInterval = Math.max(45, 90 - Math.floor(score / 5));
        if (spawnTimer > spawnInterval) { spawnObstacle(); spawnTimer = 0; }

        gameSpeed = 5 + score / 100;
        for (let i = obstacles.length - 1; i >= 0; i--) {
          obstacles[i].x -= gameSpeed;
          if (obstacles[i].x + obstacles[i].width < 0) { obstacles.splice(i, 1); continue; }
          if (checkCollision(stickman, obstacles[i])) {
            running = false;
            if (score > highscore) { highscore = Math.floor(score); highscoreEl.textContent = highscore; }
          }
        }

        score += 0.5;
        scoreEl.textContent = Math.floor(score);
      }

      drawGround();
      obstacles.forEach(drawObstacle);
      drawStickman(stickman);
      if (!running) drawGameOver();

      requestAnimationFrame(loop);
    }

    resetGame();
    loop();
  </script>
</body>
</html>
